<!DOCTYPE html>
<html lang="pt-brn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframe</title>
    <style>
        iframe {
            width: 500px;
            height: 500px;
        }

    </style>
</head>
<body>
    <h1>Testando o uso de um Iframe</h1>

    <!-- Tamanho padrão 300x150 -->

    <p>
        Acessando o site do 
        
        <iframe src="https://www.cursoemvideo.com" frameborder="0">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a>
        </iframe>

        para aprender.
    </p>

    <p>
        O site do 
        
        <iframe src="https://www.google.com.br" frameborder="0"></iframe> 
        
        também é muito legal, pena que não funciona dentro do iframe!
    </p>
</body>
</html>
